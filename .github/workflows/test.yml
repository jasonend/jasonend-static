name: Test static site

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev deps
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        run: python -m pytest -q

      - name: Check internal links + CNAME
        run: python3 scripts/check_links.py

      - name: Check for unreferenced uploads
        run: python3 scripts/prune_assets.py --check

      - name: Check header consistency
        run: python3 scripts/check_header.py
